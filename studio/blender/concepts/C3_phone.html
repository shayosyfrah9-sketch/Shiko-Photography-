<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where He Stood phone, risk test</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0a09;--ivory:#f3efe6;--gold:#f3dcb0;--scrim:rgba(11,10,9,.74);--hair:rgba(243,239,230,.28);
 --he:"Rubik","Liberation Sans","DejaVu Sans",system-ui,sans-serif;--en:"Jost","Liberation Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--ink);color:var(--ivory);font-family:var(--he)}
button,a{font:inherit;color:inherit;background:none;border:0;text-decoration:none}
.phone{position:relative;width:390px;height:844px;overflow:hidden}
.world{position:absolute;inset:0;background:url(../../renders/concepts/C/risk-test/C_rt_3_phone_backdrop_RENDERED.png) center/cover}
.world::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,10,9,.55) 0,rgba(11,10,9,0) 16%,rgba(11,10,9,0) 74%,rgba(11,10,9,.5) 100%)}
.mock{position:absolute;top:0;left:0;right:0;height:24px;display:flex;align-items:center;justify-content:center;gap:6px;font:500 11px/1 var(--en);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--gold);z-index:50;direction:ltr}
.mock span{letter-spacing:0;text-transform:none;font-weight:400}
.hdr{position:absolute;top:24px;left:0;right:0;height:56px;padding:0 6px;display:flex;align-items:center;justify-content:space-between;z-index:40}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:4px;background:var(--scrim)}
.ib svg{width:24px;height:24px}
.home{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;background:var(--scrim);border-radius:4px}
.home svg{width:24px;height:24px}
.home b{font:400 13px/1 var(--en);letter-spacing:.24em;text-transform:uppercase}
.tools{display:flex;gap:6px}
.lang{font:400 14px/1 var(--en);letter-spacing:.1em}
.field{position:absolute;z-index:20;display:flex;align-items:center;gap:7px;min-height:44px;padding:0 12px 0 10px;border-radius:4px;background:var(--scrim);font-size:14px;font-weight:500;white-space:nowrap}
.field svg{width:20px;height:20px;flex:none}
.field.on{border:1px solid var(--gold);color:var(--gold)}
.fp{position:absolute;z-index:20;display:flex;flex-direction:column;align-items:center;gap:4px}
.fp svg{width:30px;height:46px;color:var(--ivory);filter:drop-shadow(0 1px 3px rgba(0,0,0,.65))}
.fp span{font-size:13px;font-weight:500;background:var(--scrim);padding:4px 8px;border-radius:3px;white-space:nowrap}
.cap{position:absolute;left:16px;right:16px;bottom:86px;z-index:25;text-align:center;font-size:14px;line-height:1.35;background:var(--scrim);padding:9px 12px;border-radius:4px}
.dock{position:absolute;left:0;right:0;bottom:0;height:72px;padding:0 8px 12px;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;background:rgba(11,10,9,.9);border-top:1px solid var(--hair);z-index:30}
.dock>*{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px}
.dock .bk{color:var(--gold);font-weight:500}.dock .bk u{text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px}
.dock svg{width:20px;height:20px}
</style>
</head>
<body>
<div class="phone">
  <div class="mock">Mock-up <span>· HTML UI over a Rendered backdrop (Cycles)</span></div>
  <div class="world" role="img" aria-label="ריסוס ים על חוף, חול רטוב בקדמה"></div>
  <header class="hdr">
    <a class="home" href="#" aria-label="בית"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.6-2.6h4.8L16 7"/><circle cx="12" cy="13.5" r="3.6"/></svg><b lang="en">Shiko</b></a>
    <div class="tools">
      <button class="ib" aria-label="השתקת סאונד"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5c1.3 1.3 1.3 3.7 0 5M18 7.5c2.4 2.4 2.4 6.6 0 9"/></svg></button>
      <button class="ib lang" lang="en" aria-label="English">EN</button>
    </div>
  </header>

  <!-- four fields, each a small icon + name placed in the scene -->
  <a class="field on" style="top:300px;right:18px" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 14c3-5 6-5 8-1s5 4 7-1 3-3 5 0"/><path d="M2 19c3-2 6-2 9 0s6 2 11 0"/></svg>גלישה</a>
  <a class="field" style="top:196px;left:16px" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8l3.2 2.3-1.2 3.7H10l-1.2-3.7z"/></svg>ספורט</a>
  <a class="field" style="top:122px;right:70px" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20V9l9-5 9 5v11"/><path d="M3 9h18"/></svg>פסטיבלים</a>
  <a class="field" style="top:392px;left:16px" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg>פורטרטים</a>

  <!-- footprint vantage mark on the wet sand -->
  <div class="fp" style="left:50%;margin-left:-40px;top:628px;width:80px">
    <svg viewBox="0 0 30 46" fill="currentColor" aria-hidden="true"><ellipse cx="10" cy="14" rx="7" ry="11"/><ellipse cx="9" cy="32" rx="5" ry="6" opacity=".9"/><ellipse cx="22" cy="22" rx="6.5" ry="10"/><ellipse cx="21" cy="39" rx="4.6" ry="5.5" opacity=".9"/></svg>
    <span>כאן עמד שי</span>
  </div>
  <p class="cap">הקישו על העקבות כדי לראות מה ששי ראה</p>

  <nav class="dock" aria-label="פעולות ראשיות">
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>עבודות</button>
    <button class="bk"><u>הזמנת צילום</u></button>
    <a href="https://wa.me/972544351955" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2A9.7 9.7 0 0 0 3.6 16.8L2.3 21.7l5-1.3A9.7 9.7 0 1 0 12 2.2zm0 17.7c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9z"/></svg><span lang="en">WhatsApp</span></a>
  </nav>
</div>
</body>
</html>
