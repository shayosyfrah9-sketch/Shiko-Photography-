<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depth of Field mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.world{background-image:url(../../../media/photos/goa0413.jpg);background-position:38% 50%}
.tip{position:absolute;top:88px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:15;font-size:14px;padding:0 14px;height:36px;display:flex;align-items:center;background:rgba(11,10,9,.72);border:1px solid var(--hair);border-radius:3px}
.plane{position:absolute;z-index:15;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:rgba(11,10,9,.7);border-radius:3px;font-size:15px}
.plane small{font:400 13px/1 var(--en);color:var(--mute);direction:ltr}
.plane::before{content:"";width:14px;height:14px;border:1px solid var(--ivory);border-radius:1px}
.ret{position:absolute;z-index:14;width:150px;height:150px}
.ret i{position:absolute;width:18px;height:18px;border:0 solid var(--ivory)}
.ret i:nth-child(1){top:0;left:0;border-width:1.5px 0 0 1.5px}.ret i:nth-child(2){top:0;right:0;border-width:1.5px 1.5px 0 0}
.ret i:nth-child(3){bottom:0;left:0;border-width:0 0 1.5px 1.5px}.ret i:nth-child(4){bottom:0;right:0;border-width:0 1.5px 1.5px 0}
.scale{position:absolute;left:0;right:0;bottom:72px;height:92px;z-index:25;background:linear-gradient(to bottom,rgba(11,10,9,.82),rgba(11,10,9,.92) 30%)}
.ruler{position:absolute;left:16px;right:16px;top:26px;height:12px;border-top:1px solid rgba(243,239,230,.6);
  background:repeating-linear-gradient(to left,rgba(243,239,230,.6) 0 1px,transparent 1px 12px) top/100% 6px no-repeat}
.caret{position:absolute;top:10px;right:calc(16px + 41%);transform:translateX(50%);font:500 12px/1 var(--en);color:var(--gold);text-align:center}
.caret::after{content:"";display:block;margin:3px auto 0;width:0;height:0;border:5px solid transparent;border-top-color:var(--gold);border-bottom:0}
.dist{position:absolute;left:8px;right:8px;top:40px;display:grid;grid-template-columns:repeat(5,1fr)}
.dist button{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px}
.dist b{font:400 14px/1 var(--en);direction:ltr}
.hint{display:none}
.vnote{color:var(--mute)}
</style>
</head>
<body>
<div class="phone">
  <div class="mock" aria-hidden="true">Mock-up · B Depth of Field <span>· background = placeholder photo goa0413</span></div>
  <div class="world" role="img" aria-label="נוף הרכס בשקיעה, הכול חד (מציין מקום)"></div>
  <header class="hdr">
    <a class="home" href="#" aria-label="בית: חזרה לחוף כולו">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.6-2.6h4.8L16 7"/><circle cx="12" cy="13.5" r="3.6"/></svg>
      <b lang="en">Shiko</b>
    </a>
    <div class="tools">
      <button class="ib" aria-label="השתקת סאונד"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5c1.2 1.4 1.2 3.6 0 5M18 7.5c2.3 2.6 2.3 6.4 0 9"/></svg></button>
      <button class="ib lang" lang="en" aria-label="Switch to English">EN</button>
    </div>
  </header>

  <!-- concept layer: focus planes + lens distance scale (field switcher). RTL: near on the right -->
  <nav class="layer" aria-label="תחומים לפי מרחק מיקוד">
    <p class="tip">הקישו על מה שתרצו לחדד</p>
    <button class="plane" style="top:236px;left:24px">גלישה <small>∞</small></button>
    <button class="plane" style="top:300px;right:24px">ספורט <small>120 m</small></button>
    <button class="plane" style="top:404px;left:40px">פסטיבלים <small>12 m</small></button>
    <div class="ret" style="top:438px;right:120px" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <button class="plane" style="top:600px;right:96px">פורטרטים ומיתוג <small>1.5 m</small></button>
    <div class="scale">
      <div class="ruler" aria-hidden="true"></div>
      <span class="caret" aria-hidden="true">H</span>
      <div class="dist" role="group" aria-label="טבעת המיקוד. עכשיו: הכול חד">
        <button><b>1.5 m</b>פורטרטים</button><button><b>12 m</b>פסטיבלים</button><button><b>120 m</b>ספורט</button><button><b>∞</b>גלישה</button><button><b>∞ ›</b>וידאו</button>
      </div>
    </div>
  </nav>
  <section class="sheet" aria-label="כל העבודות">
    <div class="grab"></div>
    <header><h2>כל העבודות<small>18 חדרים</small></h2><button class="ib" aria-label="סגירה">✕</button></header>
    <div class="grp"><h3><b>1.5 מ׳</b>פורטרטים ומיתוג</h3><div class="chips" lang="en"><button>Mayu Portraits<small>39</small></button><button>Maya Portraits<small>25</small></button><button>Amit<small>12</small></button><button>Shira<small>42</small></button><button>Noa<small>40</small></button><button>Eden<small>25</small></button></div></div>
    <div class="grp"><h3><b>12 מ׳</b>פסטיבלים</h3><div class="chips" lang="en"><button>FreeEarth<small>11</small></button><button>Ozora<small>15</small></button><button>Zoodana<small>23</small></button><button>Goaland<small>20</small></button><button>Bardak<small>20</small></button><button>Hippietipi<small>20</small></button><button>Sounds of Love<small>20</small></button></div></div>
    <div class="grp"><h3><b>120 מ׳</b>ספורט</h3><div class="chips"><button>מכבי תל אביב<small>8</small></button><button>מכבי ראשון<small>20</small></button><button>ליגת המילואימניקים<small>11</small></button></div></div>
    <div class="grp"><h3><b>∞</b>גלישה</h3><div class="chips"><button lang="en">Surfing<small>7</small></button></div></div>
    <div class="grp"><h3><b>מעבר ל־∞</b>וידאו</h3><div class="chips"><button>שואוריל<small lang="en">soon</small></button></div></div>
    <footer><a href="#">מי אני</a><a href="#" lang="en">Matcha ↗</a></footer>
  </section>

  <section class="viewer" role="dialog" aria-label="FreeEarth, תמונה 1 מתוך 11">
    <div class="dim" style="background-image:url(../../../media/photos/goa0413.jpg);filter:blur(22px) brightness(.4)"></div>
    <div class="vbar"><h2 lang="en">FreeEarth<small lang="he">פסטיבלים</small></h2><button class="ib" aria-label="סגירה, חזרה למישור הפסטיבלים">✕</button></div>
    <div class="mount" style="top:136px;width:288px"><img src="../../../media/photos/2w2a1130.jpg" alt="רקדנית בתוך ריסוס מים בפסטיבל FreeEarth"></div>
    <div class="vctl" style="top:586px"><button class="ib" aria-label="התמונה הקודמת">→</button><span class="ct">01 / 11</span><button class="ib" aria-label="התמונה הבאה">←</button></div>
    <div class="vlinks" style="top:650px"><a href="#">לגלריה המלאה ↗</a><button>כל 11 בתצוגת רשת</button></div>
    <p class="vnote" style="top:712px">↓ החליקו למטה כדי לחזור למישור</p>
  </section>

  <nav class="dock" aria-label="פעולות ראשיות">
    <button class="work">עבודות</button>
    <button class="bk"><u>הזמנת צילום</u></button>
    <a href="https://wa.me/972544351955" aria-label="WhatsApp: שליחת הודעה לשי"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2A9.7 9.7 0 0 0 3.6 16.8L2.3 21.7l5-1.3A9.7 9.7 0 1 0 12 2.2zm0 17.7c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9z"/><path d="M8.9 7.3c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.2 5 4.4 2.5 1 3 .8 3.5.7.5-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.4l-2-1c-.3-.1-.5-.1-.7.1l-.9 1.1c-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.2z"/></svg><span lang="en">WhatsApp</span></a>
  </nav>
</div>
<script>
function st(){var h=location.hash.slice(1)||"home";document.body.className="st-"+h;var w=document.querySelector(".dock .work");if(w)w.classList.toggle("on",h==="rooms")}
addEventListener("hashchange",st);st();
</script>
</body>
</html>
