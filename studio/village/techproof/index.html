<style>
/* Layout concept: a full-bleed real-time scene with a quiet instrument layer on top (status chip, tier dock, collapsible measurements).
   Technology proof only: neutral geometry on purpose, no art direction decisions. */
:root {
  --bg: #0d0f12;
  --fg: #eef0f3;
  --muted: #9aa3ad;
  --panel: rgba(18, 21, 26, .72);
  --panel-solid: #14171c;
  --line: rgba(255, 255, 255, .14);
  --accent: #f0b35a;
  --good: #6fd19a;
  --warn: #f0b35a;
  --bad: #ff7b6b;
  --font-ui: "Rubik", "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9ecef; --fg: #14171c; --muted: #4d5661; --panel: rgba(255, 255, 255, .78); --panel-solid: #ffffff;
    --line: rgba(0, 0, 0, .16); --accent: #a8590a; --good: #1c7a4a; --warn: #a8590a; --bad: #b3261e; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9ecef; --fg: #14171c; --muted: #4d5661; --panel: rgba(255, 255, 255, .78); --panel-solid: #ffffff;
  --line: rgba(0, 0, 0, .16); --accent: #a8590a; --good: #1c7a4a; --warn: #a8590a; --bad: #b3261e; color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #0b0d10; }
.layer { position: fixed; left: 0; right: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; box-sizing: border-box; }
.layer > * { pointer-events: auto; }
#top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
#bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; max-width: 760px; }
#status b { font-weight: 600; letter-spacing: .01em; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.on { color: var(--fg); border-color: var(--accent); }
#banner { margin-top: 8px; padding: 8px 12px; font-size: 12.5px; line-height: 1.5; max-width: 760px; border-inline-start: 3px solid var(--warn); }
#banner[hidden] { display: none; }
body.hide-ui #banner, body.hide-ui #bottom { display: none; }
#banner { cursor: pointer; }
.dock { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px; max-width: 920px; }
.grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.grp > span { font-size: 11.5px; color: var(--muted); padding-inline: 4px; }
button { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; min-height: 34px; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: #14100a; border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { border-color: var(--accent); }
#details { padding: 0; max-width: 920px; max-height: 42vh; overflow: auto; }
#details summary { cursor: pointer; padding: 9px 12px; font-size: 13px; }
#details .body { padding: 2px 12px 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 22px; }
#details h4 { margin: 0 0 4px; font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#details dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
#details dt { color: var(--muted); font-size: 12.5px; min-width: 0; }
#details dd { margin: 0; text-align: end; direction: ltr; unicode-bidi: plaintext; }
table.bench { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.bench th, table.bench td { padding: 3px 6px; text-align: end; border-bottom: 1px solid var(--line); }
table.bench th:first-child, table.bench td:first-child { text-align: start; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0d10; color: #cfd5dc; font-size: 14px; letter-spacing: .08em; transition: opacity .6s; z-index: 5; }
#loading.done { opacity: 0; pointer-events: none; }
#err { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); text-align: center; }
#err[hidden] { display: none; }
#out { width: 100%; height: 90px; font-family: var(--font-num); font-size: 11px; background: var(--panel-solid); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; box-sizing: border-box; }
@media (max-width: 520px) { button { padding: 6px 9px; font-size: 12.5px; } .dock { padding: 6px; } }
@media (prefers-reduced-motion: reduce) { #loading { transition: none; } }

TP.api = { setTier: (i) => { auto = false; return applyTier(i, 'api'); }, setT: (t) => { camT = t; autopilot = false; flyTo = null; }, snapshot, results, applyPhotos, runBench, tiers: TIERS, streamZoneB, setAuto: (v) => { auto = v; } };
setSky(0); resize();
if (!WASM_OK) showNote('WebAssembly חסום בסביבה הזו, ולכן KTX2 ו־meshopt לא יכולים לרוץ. הבדיקה עברה לקבצי JPG ו־GLB לא דחוסים (משקל גדול יותר). מדדי המשקל של הדחיסה לא תקפים כאן; כדאי לפתוח גם בלשונית רגילה.');
const startTier = tierIdx;
// placeholder level first: tiny textures + low-poly terrain, so something real is on screen almost immediately
{
  const [tg, rg] = await Promise.all([loadGeo('terrain_lod1'), loadGeo('rock_lod1')]);
  await Promise.all(['ground', 'rock', 'wood'].map((n) => upgradeMaterial(n, 's', null)));
  terrain.geometry = tg; terrain.visible = true; mark('placeholder assets ready'); ABS.placeholder = performance.now(); TP.state.placeholder = true;
  rocks.A = makeRocks(rocks.listA.slice(0, 60), rg); scene.add(rocks.A); // a first handful of rocks, zone content follows
}
if (!(new URLSearchParams(location.search).has('manual'))) { /* normal start */ }
requestAnimationFrame(loop);
const STAGED = QS.get('boot') !== 'direct'; // ?boot=direct: skip the light first-frame level and go straight to the start tier (A/B on real devices)
TP.bootMode = STAGED ? 'staged' : 'direct';
if (STAGED) await applyTier(0, 'boot: first frame without post-processing');
// first frames are on screen at the light level; only then step up to the start tier (spreads shader compilation instead of blocking the first frame)
if (STAGED) await new Promise((res) => { const iv = setInterval(() => { if (TP.state.firstFrame && frame >= 6) { clearInterval(iv); res(); } }, 50); });
if (!STAGED || startTier > 0) await applyTier(startTier, 'start');
setTimeout(() => { if (rocks.A) { scene.remove(rocks.A); rocks.A.dispose(); rocks.A = null; } streamZoneB(); }, 1200);
} catch (e) { fail(e); }
</script>
